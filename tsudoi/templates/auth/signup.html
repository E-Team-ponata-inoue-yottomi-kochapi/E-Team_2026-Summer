{% extends "base.html" %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<div>
    <!-- usersテーブルにはnameが無いので email / password のみ -->
    <form method="POST" action="{{ url_for('auth.signup_process')}}">
        <!-- CSRF対策：トークン -->
        <input type="hidden" name="csrf_token" value="{{ csrf_token()}}">
        <header>
            <h1>新規登録</h1>
        </header>
        <div>
            <label for="email">メールアドレス</label>
            <!-- value：入力エラー時もメールアドレスを保持 -->
            <input type="text" id="email" name="email" value="{{ email }}" required>
        </div>
        <div>
            <label for="password">パスワード</label>
            <input type="password" id="password" name="password" required>
            <p>15文字以上入力してください</p>
            <p>スペースは使用できません</p>
        </div>
        <div>
            <label for="password_confirmation">パスワード(確認)</label>
            <input type="password" id="password_confirmation" name="password_confirmation" required>
        </div>
        <!-- 入力チェックでエラーの場合、ここにメッセージを表示 -->
        <div>
            {% if messages %}
            <ul>
                {% for message in messages %}
                <li>{{ message }}</li>
                {% endfor %}
            </ul>
            {% endif %}
        </div>
        <div>
            <p>アカウント登録後、プロフィールや家族情報の登録へ進みます</p>
            <button type="submit">登録する</button>
        </div>
    </form>
    <div>
        <a href="{{ url_for('auth.login_view') }}">ログインはこちら</a>
    </div>
</div>
{% endblock %}
