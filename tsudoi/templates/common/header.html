{% if session.get("user_id") %}
<header class="app-header">
    {% if back_page_url %}
    <a href="{{ back_page_url }}" class="app-header__back">
        <i class="fa-solid fa-chevron-left"></i>{{ back_page_title }}
    </a>
    {% endif %}
    <form class="app-header__logout" action="{{ url_for('auth.logout')}}" method="POST" >
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span class="text-xs">ログアウト</span>
        </button>
    </form>
</header>
{% endif %}
