{% extends "base.html" %}
{% block title %}家族一覧{% endblock %}
{% block content %}
<a href="#">← マイページに戻る</a>

<h1>家族一覧</h1>

<a href="{{ url_for('household.member_new_view') }}">+ 追加する</a>
<ul>
  {% for member in members %}
  <li>
    {{ member.name }}
    <a href="{{ url_for('household.member_edit_view', id=member.id) }}">編集</a>
  </li>
  <form action="{{ url_for('household.member_delete_process', id=member.id) }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit">削除</button>
</form>
  {% endfor %}
</ul>
{% endblock %}
