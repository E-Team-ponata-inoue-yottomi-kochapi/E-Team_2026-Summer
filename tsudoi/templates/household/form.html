{% extends "base.html" %}
{% block title %}{{ "家族編集" if member else "家族追加" }}{% endblock %}
{% block content %}
<a href="#">← マイページに戻る</a>

<h1>{{ "家族編集" if member else "家族追加" }}</h1>

<form action="{{ url_for('household.member_edit_process', id=member.id) if member else url_for('household.member_create_process') }}" method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="text" name="name" value="{{ member.name if member else '' }}" required>
  <button type="submit">{{ "更新" if member else "追加" }}</button>
</form>
{% endblock %}
