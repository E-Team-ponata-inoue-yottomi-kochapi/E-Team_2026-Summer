<!-- base.htmlを利用する -->
{% extends "base.html" %}

<!-- ここからbaseのheadに差し込まれる -->
{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/error.css') }}">
{% endblock %}
<!-- ここまで -->

<!-- ここからbaseのbodyに差し込まれる -->
{% block content %}
<div>
    <h1>403 エラー<br>（Forbidden）</h1>
    <p>申し訳ありません</p>
    <p>このページを閲覧する権限がありません</p>
</div>
<div>
    {% if session.get("user_id") %}
    <a href="{{ url_for('mypage.mypage_view') }}">マイページへ戻る</a>
    {% else %}
    <a href="{{ url_for('auth.login_view') }}">ログインへ戻る</a>
    {% endif %}
</div>
{% endblock %}
